<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#4F46E5" stroke="#312E81" stroke-width="8"/>
  
  <!-- Hand gesture representing sign language -->
  <g transform="translate(128, 128)">
    <!-- Hand outline -->
    <path d="M-40,-20 Q-50,-30 -40,-40 Q-30,-50 -20,-40 Q-10,-30 -20,-20 Q-30,-10 -40,-20 Z" 
          fill="#FBBF24" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Fingers -->
    <circle cx="-35" cy="-35" r="8" fill="#FBBF24"/>
    <circle cx="-25" cy="-35" r="8" fill="#FBBF24"/>
    <circle cx="-15" cy="-35" r="8" fill="#FBBF24"/>
    <circle cx="-30" cy="-25" r="6" fill="#FBBF24"/>
    <circle cx="-20" cy="-25" r="6" fill="#FBBF24"/>
    
    <!-- Thumb -->
    <ellipse cx="-45" cy="-15" rx="12" ry="8" fill="#FBBF24" transform="rotate(-30 -45 -15)"/>
    
    <!-- Sign language symbols -->
    <g transform="translate(20, -20)">
      <!-- "A" in sign language -->
      <path d="M0,0 L10,0 L10,20 L0,20 Z M2,2 L8,2 L8,18 L2,18 Z" fill="#1F2937"/>
      <path d="M5,5 L5,15 M3,10 L7,10" stroke="#1F2937" stroke-width="1"/>
    </g>
    
    <!-- "S" in sign language -->
    <g transform="translate(35, -20)">
      <circle cx="5" cy="5" r="8" fill="none" stroke="#1F2937" stroke-width="2"/>
      <path d="M2,5 Q5,2 8,5 Q5,8 2,5" fill="#1F2937"/>
    </g>
  </g>
  
  <!-- App name -->
  <text x="128" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1F2937">SignBridge</text>
</svg>
